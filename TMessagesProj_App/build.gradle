apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

def devLocalPropsFile = rootProject.file('fluffyGram_dev/devlocal.properties')
def devLocalProps = new Properties()
if (devLocalPropsFile.exists()) {
    devLocalProps.load(new FileInputStream(devLocalPropsFile))
}
def getDevLocalProp = { String key, String fallback ->
    def value = devLocalProps.getProperty(key)
    return value != null && value.trim().length() > 0 ? value.trim() : fallback
}
def releaseStoreFilePath = getDevLocalProp("storeFile", "../TMessagesProj/config/release.keystore")
def releaseStorePassword = getDevLocalProp("storePassword", RELEASE_STORE_PASSWORD)
def releaseKeyAlias = getDevLocalProp("keyAlias", RELEASE_KEY_ALIAS)
def releaseKeyPassword = getDevLocalProp("keyPassword", RELEASE_KEY_PASSWORD)
def localGoogleServices = rootProject.file('fluffyGram_dev/google-services.json')
def fluffyPatchVersion = Math.max(0, Integer.parseInt((project.findProperty("FLUFFY_PATCH_VERSION") ?: "0").toString()))
def fluffyVersionName = fluffyPatchVersion > 0 ? APP_VERSION_NAME + "." + fluffyPatchVersion : APP_VERSION_NAME
def fluffyVersionCode = Integer.parseInt(APP_VERSION_CODE) * 1000 + fluffyPatchVersion
def fluffyUpdateManifestUrl = (project.findProperty("FLUFFY_UPDATE_MANIFEST_URL") ?: "").toString()
def fluffyUpdatePageUrl = (project.findProperty("FLUFFY_UPDATE_PAGE_URL") ?: "").toString()
def fluffyBetaUpdateManifestUrl = (project.findProperty("FLUFFY_BETA_UPDATE_MANIFEST_URL") ?: fluffyUpdateManifestUrl).toString()
def fluffyBetaUpdatePageUrl = (project.findProperty("FLUFFY_BETA_UPDATE_PAGE_URL") ?: fluffyUpdatePageUrl).toString()
def mapsApiKey = getDevLocalProp("MAPS_V2_API", (System.getenv("MAPS_V2_API") ?: "").trim())
def fluffyAllAbisEnabled = (project.findProperty("FLUFFY_ALL_ABIS") ?: "false").toString().toBoolean()
def fluffyNativeAbis = fluffyAllAbisEnabled
        ? ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
        : ["arm64-v8a"]

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'

    defaultConfig.applicationId = "org.ushastoe.fluffy"

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file(releaseStoreFilePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }

        release {
            storeFile file(releaseStoreFilePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".beta"
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'SYMBOL_TABLE'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters(*fluffyNativeAbis)
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters(*fluffyNativeAbis)
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters(*fluffyNativeAbis)
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = fluffyVersionCode

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionName fluffyVersionName
        ndkVersion "21.4.7075529"
        manifestPlaceholders = [MAPS_V2_API: mapsApiKey]

        multiDexEnabled true
        buildConfigField "String", "FLUFFY_UPDATE_MANIFEST_URL", "\"" + fluffyUpdateManifestUrl + "\""
        buildConfigField "String", "FLUFFY_UPDATE_PAGE_URL", "\"" + fluffyUpdatePageUrl + "\""
        buildConfigField "String", "FLUFFY_BETA_UPDATE_MANIFEST_URL", "\"" + fluffyBetaUpdateManifestUrl + "\""
        buildConfigField "String", "FLUFFY_BETA_UPDATE_PAGE_URL", "\"" + fluffyBetaUpdatePageUrl + "\""
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

def syncLocalGoogleServices = tasks.register("syncLocalGoogleServices", Copy) {
    onlyIf { localGoogleServices.exists() }
    from(localGoogleServices)
    into(layout.projectDirectory)
    rename { "google-services.json" }
}

preBuild.dependsOn syncLocalGoogleServices
tasks.matching { it.name.startsWith("process") && it.name.endsWith("GoogleServices") }.configureEach {
    dependsOn syncLocalGoogleServices
}
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("JniLibFolders") }.configureEach {
    dependsOn(":TMessagesProj:syncLocalGoogleServices")
}
tasks.matching { it.name.startsWith("collect") && it.name.endsWith("Dependencies") }.configureEach {
    dependsOn(":TMessagesProj:syncLocalGoogleServices")
}

apply plugin: 'com.google.gms.google-services'
