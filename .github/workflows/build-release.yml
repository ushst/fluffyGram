name: Build Release APK

on:
  push:
    tags:
      - 'fluffy-v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: What to build
        required: false
        default: 'release and debug'
        type: choice
        options:
          - release and debug
          - release
          - debug
      create_release:
        description: Create GitHub Release
        required: false
        default: true
        type: boolean
      post_to_telegram:
        description: Post built APK to Telegram channel
        required: false
        default: true
        type: boolean
      changelog:
        description: Optional changelog text for update.json and release notes
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '21'
      ANDROID_PLATFORM: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '21.4.7075529'
      CCACHE_KEY_SCOPE: global
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: 'time_macros'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: krolchonok/fluffyGram
          token: ${{ secrets.GH_PAT || github.token }}
          ref: ${{ github.ref }}
          fetch-depth: 100

      - name: Checkout private submodule (latest main)
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "GH_PAT is not set, skipping private submodule checkout"
            exit 0
          fi
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"
          git submodule sync -- fluffyGram_dev
          git submodule update --init --remote --depth 1 fluffyGram_dev

      - name: Fetch tags for release notes
        run: git -c fetch.recurseSubmodules=false fetch --force --tags origin

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ env.CCACHE_KEY_SCOPE }}-v1
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.CCACHE_KEY_SCOPE }}-
            ${{ runner.os }}-ccache-
          append-timestamp: false
          max-size: 5G
          create-symlink: true
          update-package-index: true
      - name: Restore CMake intermediates
        id: cache-cmake-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: ${{ runner.os }}-cmake-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/jni/**/CMakeLists.txt', 'TMessagesProj_App/build.gradle', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ env.ANDROID_NDK_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            cmake;3.22.1
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Prepare signing and local config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fluffyGram_dev

          if [ -z "${{ secrets.FLUFFY_SYNC_BACKEND_URL }}" ]; then
            echo "Missing FLUFFY_SYNC_BACKEND_URL secret" >&2
            exit 1
          fi
          if [ -z "${{ secrets.FLUFFY_SYNC_HELPER_BOT }}" ]; then
            echo "Missing FLUFFY_SYNC_HELPER_BOT secret" >&2
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fluffyGram_dev/ushastoe-release.keystore

          cat > fluffyGram_dev/devlocal.properties <<EOF
          storeFile=../fluffyGram_dev/ushastoe-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          MAPS_V2_API=${{ secrets.MAPS_V2_API }}
          TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
          FLUFFY_SYNC_BACKEND_URL=${{ secrets.FLUFFY_SYNC_BACKEND_URL }}
          FLUFFY_SYNC_HELPER_BOT=${{ secrets.FLUFFY_SYNC_HELPER_BOT }}
          EOF

          if [ -f "fluffyGram_dev/google-services.json" ]; then
            echo "Using google-services.json from fluffyGram_dev submodule"
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > fluffyGram_dev/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > fluffyGram_dev/google-services.json
          else
            echo "Missing GOOGLE_SERVICES_JSON or GOOGLE_SERVICES_JSON_BASE64 secret" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("fluffyGram_dev/google-services.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("google-services.json root is not an object")
          print("Validated google-services.json")
          PY

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          props = {}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or "=" not in stripped:
                  continue
              key, value = stripped.split("=", 1)
              props[key.strip()] = value.strip().replace("\\:", ":")

          base_name = props["APP_VERSION_NAME"]
          base_code = int(props["APP_VERSION_CODE"])
          patch = int(props.get("FLUFFY_PATCH_VERSION", "0"))
          version_name = f"{base_name}.{patch}" if patch > 0 else base_name
          tag_name = f"fluffy-v{version_name}"
          release_tag = os.environ["GITHUB_REF_NAME"] if os.environ.get("GITHUB_REF_TYPE") == "tag" else tag_name
          release_name = f"fluffyGram {version_name} ({base_code})"
          apk_name = f"fluffyGram-{version_name}.apk"
          debug_apk_name = f"fluffyGram-{version_name}-debug.apk"
          update_manifest_name = "update.json"
          beta_update_manifest_name = "update-beta.json"
          page_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{release_tag}"
          apk_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{apk_name}"
          debug_apk_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{debug_apk_name}"
          beta_update_manifest_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{beta_update_manifest_name}"

          print(f"version_name={version_name}")
          print(f"version_code={base_code}")
          print(f"tag_name={tag_name}")
          print(f"release_tag={release_tag}")
          print(f"release_name={release_name}")
          print(f"apk_name={apk_name}")
          print(f"debug_apk_name={debug_apk_name}")
          print(f"update_manifest_name={update_manifest_name}")
          print(f"beta_update_manifest_name={beta_update_manifest_name}")
          print(f"page_url={page_url}")
          print(f"apk_url={apk_url}")
          print(f"debug_apk_url={debug_apk_url}")
          print(f"beta_update_manifest_url={beta_update_manifest_url}")
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Resolve build type
        id: build_type
        shell: bash
        run: |
          BT="${{ inputs.build_type }}"
          if [ -z "$BT" ]; then
            BT="release and debug"
          fi
          BUILD_RELEASE=false
          BUILD_DEBUG=false
          if [[ "$BT" == "release" || "$BT" == "release and debug" ]]; then
            BUILD_RELEASE=true
          fi
          if [[ "$BT" == "debug" || "$BT" == "release and debug" ]]; then
            BUILD_DEBUG=true
          fi
          echo "build_release=$BUILD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "build_debug=$BUILD_DEBUG" >> "$GITHUB_OUTPUT"
          echo "Resolved build type: $BT (release=$BUILD_RELEASE, debug=$BUILD_DEBUG)"

      - name: Build APKs
        run: |
          BUILD_RELEASE="${{ steps.build_type.outputs.build_release }}"
          BUILD_DEBUG="${{ steps.build_type.outputs.build_debug }}"
          TASKS=""
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            TASKS="$TASKS :TMessagesProj:assembleRelease :TMessagesProj_App:assembleAfatRelease"
          fi
          if [[ "$BUILD_DEBUG" == "true" ]]; then
            TASKS="$TASKS :TMessagesProj:assembleDebug :TMessagesProj_App:assembleAfatDebug"
          fi
          if [ -z "${TASKS// }" ]; then
            echo "No build tasks selected. Please choose a valid build_type." >&2
            exit 1
          fi
          ./gradlew $TASKS
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_CCACHE: ccache

      - name: Save CMake intermediates
        if: always() && steps.cache-cmake-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: ${{ steps.cache-cmake-restore.outputs.cache-primary-key }}

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUILD_RELEASE="${{ steps.build_type.outputs.build_release }}"
          BUILD_DEBUG="${{ steps.build_type.outputs.build_debug }}"

          if [[ "$BUILD_RELEASE" == "true" ]]; then
            RELEASE_APK_PATH="$(find TMessagesProj_App/build/outputs/apk -path '*afat/release/app.apk' | head -n 1)"
            if [ -z "$RELEASE_APK_PATH" ]; then
              echo "Release APK not found" >&2
              exit 1
            fi
            cp "$RELEASE_APK_PATH" "artifacts/${{ steps.meta.outputs.apk_name }}"
          fi

          if [[ "$BUILD_DEBUG" == "true" ]]; then
            DEBUG_APK_PATH="$(find TMessagesProj_App/build/outputs/apk -path '*afat/debug/app.apk' | head -n 1)"
            if [ -z "$DEBUG_APK_PATH" ]; then
              echo "Debug APK not found" >&2
              exit 1
            fi
            cp "$DEBUG_APK_PATH" "artifacts/${{ steps.meta.outputs.debug_apk_name }}"
          fi

          ls -lah artifacts

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          PREV_TAG=""

          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            BODY="${{ github.event.inputs.changelog }}"
          else
            CURRENT_TAG="${{ steps.meta.outputs.release_tag }}"
            PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)"

            if [ -n "$PREV_TAG" ]; then
              BODY="$(printf '## Changes since %s\n\n' "$PREV_TAG"; git log "$PREV_TAG"..HEAD --pretty='- %s (%h)')"
            else
              BODY="$(printf '## Changes in this build\n\n'; git log -20 --pretty='- %s (%h)')"
            fi
          fi

          if [ -z "$BODY" ]; then
            BODY="## Changes in this build"
          fi

          printf '%s\n' "$BODY" > artifacts/changelog.txt

          {
            echo 'body<<EOF'
            printf '%s\n' "$BODY"
            echo 'EOF'
            echo "previous_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Telegram post metadata
        id: telegram_meta
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ steps.meta.outputs.release_tag }}"
          PREV_TAG="${{ steps.notes.outputs.previous_tag }}"

          if [ -n "$PREV_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          else
            COMPARE_URL="https://github.com/${{ github.repository }}/releases/tag/${CURRENT_TAG}"
          fi

          {
            echo "compare_url=$COMPARE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Generate update manifests
        shell: bash
        run: |
          set -euo pipefail
          BUILD_RELEASE="${{ steps.build_type.outputs.build_release }}"
          BUILD_DEBUG="${{ steps.build_type.outputs.build_debug }}"

          if [[ "$BUILD_RELEASE" == "true" ]]; then
            RELEASE_SHA256="$(sha256sum "artifacts/${{ steps.meta.outputs.apk_name }}" | cut -d ' ' -f 1)"
            python scripts/generate_update_manifest.py \
              --gradle-properties gradle.properties \
              --apk-url "${{ steps.meta.outputs.apk_url }}" \
              --page-url "${{ steps.meta.outputs.page_url }}" \
              --sha256 "$RELEASE_SHA256" \
              --file-name "${{ steps.meta.outputs.apk_name }}" \
              --changelog-file artifacts/changelog.txt \
              --output "artifacts/${{ steps.meta.outputs.update_manifest_name }}"
          fi

          if [[ "$BUILD_DEBUG" == "true" ]]; then
            DEBUG_SHA256="$(sha256sum "artifacts/${{ steps.meta.outputs.debug_apk_name }}" | cut -d ' ' -f 1)"
            python scripts/generate_update_manifest.py \
              --gradle-properties gradle.properties \
              --apk-url "${{ steps.meta.outputs.debug_apk_url }}" \
              --page-url "${{ steps.meta.outputs.page_url }}" \
              --sha256 "$DEBUG_SHA256" \
              --file-name "${{ steps.meta.outputs.debug_apk_name }}" \
              --changelog-file artifacts/changelog.txt \
              --output "artifacts/${{ steps.meta.outputs.beta_update_manifest_name }}"
          fi

      - name: Upload APK artifact
        if: env.ACT != 'true' && steps.build_type.outputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: artifacts/${{ steps.meta.outputs.apk_name }}
          retention-days: 30

      - name: Upload debug APK artifact
        if: env.ACT != 'true' && steps.build_type.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.debug_apk_name }}
          path: artifacts/${{ steps.meta.outputs.debug_apk_name }}
          retention-days: 30

      - name: Upload update manifest artifact
        if: env.ACT != 'true' && steps.build_type.outputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-json-${{ steps.meta.outputs.version_name }}
          path: artifacts/${{ steps.meta.outputs.update_manifest_name }}
          retention-days: 30

      - name: Upload beta update manifest artifact
        if: env.ACT != 'true' && steps.build_type.outputs.build_debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-beta-json-${{ steps.meta.outputs.version_name }}
          path: artifacts/${{ steps.meta.outputs.beta_update_manifest_name }}
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.create_release || github.event.inputs.create_release == 'true'))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          BUILD_RELEASE: ${{ steps.build_type.outputs.build_release }}
          BUILD_DEBUG: ${{ steps.build_type.outputs.build_debug }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing GH token for release publish"
            exit 1
          fi

          FILES=()
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            FILES+=("artifacts/${{ steps.meta.outputs.apk_name }}")
            FILES+=("artifacts/${{ steps.meta.outputs.update_manifest_name }}")
          fi
          if [[ "$BUILD_DEBUG" == "true" ]]; then
            FILES+=("artifacts/${{ steps.meta.outputs.debug_apk_name }}")
            FILES+=("artifacts/${{ steps.meta.outputs.beta_update_manifest_name }}")
          fi

          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              -R "$GH_REPO" \
              --title "$RELEASE_NAME" \
              --notes-file artifacts/changelog.txt

            gh release upload "$RELEASE_TAG" \
              -R "$GH_REPO" \
              --clobber \
              "${FILES[@]}"
          else
            gh release create "$RELEASE_TAG" \
              -R "$GH_REPO" \
              --title "$RELEASE_NAME" \
              --notes-file artifacts/changelog.txt \
              "${FILES[@]}"
          fi

      - name: Post release to Telegram channel
        if: steps.build_type.outputs.build_release == 'true' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.post_to_telegram || github.event.inputs.post_to_telegram == 'true')))
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          COMPARE_URL: ${{ steps.telegram_meta.outputs.compare_url }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHANNEL_ID}" ]]; then
            echo "::warning::Skipping Telegram post because TELEGRAM_BOT_TOKEN or TELEGRAM_CHANNEL_ID is missing."
            echo "Set both in repository or organization GitHub Actions secrets if Telegram posting is required."
            exit 0
          fi

          if [[ "${TELEGRAM_CHANNEL_ID}" =~ ^[0-9]+$ ]]; then
            echo "::warning::TELEGRAM_CHANNEL_ID looks like a positive numeric ID. For channels/supergroups it usually must start with -100..."
          fi

          CAPTION=$(cat <<EOF
🚀 fluffyGram ${VERSION_NAME} (${VERSION_CODE})

📋 Changelog: ${COMPARE_URL}
EOF
          )
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          APK_PATH="artifacts/${{ steps.meta.outputs.apk_name }}"
          MAX_TELEGRAM_DOCUMENT_SIZE=$((50 * 1024 * 1024))

          RESPONSE_FILE="artifacts/telegram-send-response.json"
          MESSAGE_ID=""
          APK_SIZE=$(stat -c%s "$APK_PATH")

          if [[ "$APK_SIZE" -gt "$MAX_TELEGRAM_DOCUMENT_SIZE" ]]; then
            echo "::warning::APK is ${APK_SIZE} bytes, which exceeds Telegram Bot API upload limit ${MAX_TELEGRAM_DOCUMENT_SIZE}. Posting release link instead."
            MESSAGE_TEXT=$(cat <<EOF
🚀 fluffyGram ${VERSION_NAME} (${VERSION_CODE})

📦 APK is too large for direct Telegram upload.
🔗 Release: ${RELEASE_URL}
📋 Changelog: ${COMPARE_URL}
EOF
            )

            if ! HTTP_CODE="$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
              --data-urlencode "text=${MESSAGE_TEXT}" \
              --data-urlencode "disable_web_page_preview=true")"; then
              echo "::warning::Telegram sendMessage request failed at transport level."
              cat "$RESPONSE_FILE" 2>/dev/null || true
              exit 0
            fi
          else
            if ! HTTP_CODE="$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
              -F "document=@${APK_PATH}" \
              -F "caption=${CAPTION}")"; then
              echo "::warning::Telegram sendDocument request failed at transport level."
              cat "$RESPONSE_FILE" 2>/dev/null || true
              exit 0
            fi
          fi

          if [[ "$HTTP_CODE" -ge 400 ]]; then
            echo "::warning::Telegram API returned HTTP $HTTP_CODE"
            cat "$RESPONSE_FILE" || true
            exit 0
          fi

          if ! MESSAGE_ID="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/telegram-send-response.json").read_text(encoding="utf-8"))
          if not data.get("ok"):
            raise SystemExit(f"Telegram API request failed: {data}")
          print(data["result"]["message_id"])
          PY
          )"; then
            echo "::warning::Telegram API returned an unexpected payload."
            cat "$RESPONSE_FILE" || true
            exit 0
          fi

          PIN_RESPONSE_FILE="artifacts/telegram-pin-response.json"
          if ! PIN_HTTP_CODE="$(curl -sS -w '%{http_code}' -o "$PIN_RESPONSE_FILE" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/pinChatMessage" \
            -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -d "message_id=${MESSAGE_ID}" \
            -d "disable_notification=true")"; then
            echo "::warning::Telegram pinChatMessage request failed at transport level."
            cat "$PIN_RESPONSE_FILE" 2>/dev/null || true
            exit 0
          fi

          if [[ "$PIN_HTTP_CODE" -ge 400 ]]; then
            echo "::warning::pinChatMessage failed with HTTP $PIN_HTTP_CODE"
            cat "$PIN_RESPONSE_FILE" || true
            echo "Continuing because APK upload already succeeded."
          fi
