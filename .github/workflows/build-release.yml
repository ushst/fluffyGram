name: Build Release APK

on:
  push:
    tags:
      - 'fluffy-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create GitHub Release
        required: false
        default: true
        type: boolean
      changelog:
        description: Optional changelog text for update.json and release notes
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '21'
      ANDROID_PLATFORM: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '21.4.7075529'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100

      - name: Checkout private submodule
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "GH_PAT is not set, skipping private submodule checkout"
            exit 0
          fi
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 fluffyGram_dev

      - name: Fetch tags for release notes
        run: git fetch --force --tags origin

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          restore-keys: |
            ${{ runner.os }}-ccache-
          create-symlink: true
      - name: Cache CMake intermediates
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: ${{ runner.os }}-cmake-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/jni/**/CMakeLists.txt', 'TMessagesProj_App/build.gradle', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ env.ANDROID_NDK_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Prepare signing and local config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fluffyGram_dev

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fluffyGram_dev/ushastoe-release.keystore

          cat > fluffyGram_dev/devlocal.properties <<EOF
          storeFile=../fluffyGram_dev/ushastoe-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          MAPS_V2_API=${{ secrets.MAPS_V2_API }}
          TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
          EOF

          if [ -f "fluffyGram_dev/google-services.json" ]; then
            echo "Using google-services.json from fluffyGram_dev submodule"
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > fluffyGram_dev/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > fluffyGram_dev/google-services.json
          else
            echo "Missing GOOGLE_SERVICES_JSON or GOOGLE_SERVICES_JSON_BASE64 secret" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("fluffyGram_dev/google-services.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("google-services.json root is not an object")
          print("Validated google-services.json")
          PY

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          props = {}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or "=" not in stripped:
                  continue
              key, value = stripped.split("=", 1)
              props[key.strip()] = value.strip().replace("\\:", ":")

          base_name = props["APP_VERSION_NAME"]
          base_code = int(props["APP_VERSION_CODE"])
          patch = int(props.get("FLUFFY_PATCH_VERSION", "0"))
          version_name = f"{base_name}.{patch}" if patch > 0 else base_name
          tag_name = f"fluffy-v{version_name}"
          release_tag = os.environ["GITHUB_REF_NAME"] if os.environ.get("GITHUB_REF_TYPE") == "tag" else tag_name
          release_name = f"fluffyGram {version_name} ({base_code})"
          apk_name = f"fluffyGram-{version_name}.apk"
          debug_apk_name = f"fluffyGram-{version_name}-debug.apk"
          update_manifest_name = "update.json"
          beta_update_manifest_name = "update-beta.json"
          page_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{release_tag}"
          apk_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{apk_name}"
          debug_apk_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{debug_apk_name}"
          beta_update_manifest_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{beta_update_manifest_name}"

          print(f"version_name={version_name}")
          print(f"version_code={base_code}")
          print(f"tag_name={tag_name}")
          print(f"release_tag={release_tag}")
          print(f"release_name={release_name}")
          print(f"apk_name={apk_name}")
          print(f"debug_apk_name={debug_apk_name}")
          print(f"update_manifest_name={update_manifest_name}")
          print(f"beta_update_manifest_name={beta_update_manifest_name}")
          print(f"page_url={page_url}")
          print(f"apk_url={apk_url}")
          print(f"debug_apk_url={debug_apk_url}")
          print(f"beta_update_manifest_url={beta_update_manifest_url}")
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build release and debug APKs
        run: ./gradlew :TMessagesProj:assembleRelease :TMessagesProj:assembleDebug :TMessagesProj_App:assembleAfatRelease :TMessagesProj_App:assembleAfatDebug :TMessagesProj_App:bundleBundleAfatRelease
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_CCACHE: ccache

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          RELEASE_APK_PATH="$(find TMessagesProj_App/build/outputs/apk -path '*afat/release/app.apk' | head -n 1)"
          DEBUG_APK_PATH="$(find TMessagesProj_App/build/outputs/apk -path '*afat/debug/app.apk' | head -n 1)"
          RELEASE_AAB_PATH="$(find TMessagesProj_App/build/outputs/bundle -path '*bundleAfatRelease/*.aab' | head -n 1)"
          if [ -z "$RELEASE_APK_PATH" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          if [ -z "$DEBUG_APK_PATH" ]; then
            echo "Debug APK not found" >&2
            exit 1
          fi
          if [ -z "$RELEASE_AAB_PATH" ]; then
            echo "Release AAB not found" >&2
            exit 1
          fi
          cp "$RELEASE_APK_PATH" "artifacts/${{ steps.meta.outputs.apk_name }}"
          cp "$DEBUG_APK_PATH" "artifacts/${{ steps.meta.outputs.debug_apk_name }}"
          cp "$RELEASE_AAB_PATH" "artifacts/fluffyGram-${{ steps.meta.outputs.version_name }}.aab"
          ls -lah artifacts

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          PREV_TAG=""

          if [ -n "${{ github.event.inputs.changelog }}" ]; then
            BODY="${{ github.event.inputs.changelog }}"
          else
            CURRENT_TAG="${{ steps.meta.outputs.release_tag }}"
            PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)"

            if [ -n "$PREV_TAG" ]; then
              BODY="$(printf '## Changes since %s\n\n' "$PREV_TAG"; git log "$PREV_TAG"..HEAD --pretty='- %s (%h)')"
            else
              BODY="$(printf '## Changes in this build\n\n'; git log -20 --pretty='- %s (%h)')"
            fi
          fi

          if [ -z "$BODY" ]; then
            BODY="## Changes in this build"
          fi

          printf '%s\n' "$BODY" > artifacts/changelog.txt

          {
            echo 'body<<EOF'
            printf '%s\n' "$BODY"
            echo 'EOF'
            echo "previous_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Telegram post metadata
        id: telegram_meta
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ steps.meta.outputs.release_tag }}"
          PREV_TAG="${{ steps.notes.outputs.previous_tag }}"

          if [ -n "$PREV_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
            COMMITS_SUMMARY="$(git log "${PREV_TAG}"..HEAD --pretty='• %s (%h)' -n 15)"
          else
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${CURRENT_TAG}"
            COMMITS_SUMMARY="$(git log -15 --pretty='• %s (%h)')"
          fi

          if [ -z "$COMMITS_SUMMARY" ]; then
            COMMITS_SUMMARY="• Без изменений в журнале коммитов"
          fi

          {
            echo "compare_url=$COMPARE_URL"
            echo 'commits_summary<<EOF'
            printf '%s\n' "$COMMITS_SUMMARY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate update manifests
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA256="$(sha256sum "artifacts/${{ steps.meta.outputs.apk_name }}" | cut -d ' ' -f 1)"
          DEBUG_SHA256="$(sha256sum "artifacts/${{ steps.meta.outputs.debug_apk_name }}" | cut -d ' ' -f 1)"
          python scripts/generate_update_manifest.py \
            --gradle-properties gradle.properties \
            --apk-url "${{ steps.meta.outputs.apk_url }}" \
            --page-url "${{ steps.meta.outputs.page_url }}" \
            --sha256 "$RELEASE_SHA256" \
            --file-name "${{ steps.meta.outputs.apk_name }}" \
            --changelog-file artifacts/changelog.txt \
            --output "artifacts/${{ steps.meta.outputs.update_manifest_name }}"
          python scripts/generate_update_manifest.py \
            --gradle-properties gradle.properties \
            --apk-url "${{ steps.meta.outputs.debug_apk_url }}" \
            --page-url "${{ steps.meta.outputs.page_url }}" \
            --sha256 "$DEBUG_SHA256" \
            --file-name "${{ steps.meta.outputs.debug_apk_name }}" \
            --changelog-file artifacts/changelog.txt \
            --output "artifacts/${{ steps.meta.outputs.beta_update_manifest_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: artifacts/${{ steps.meta.outputs.apk_name }}
          retention-days: 30

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.debug_apk_name }}
          path: artifacts/${{ steps.meta.outputs.debug_apk_name }}
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluffyGram-${{ steps.meta.outputs.version_name }}.aab
          path: artifacts/fluffyGram-${{ steps.meta.outputs.version_name }}.aab
          retention-days: 30

      - name: Upload update manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-json-${{ steps.meta.outputs.version_name }}
          path: artifacts/${{ steps.meta.outputs.update_manifest_name }}
          retention-days: 30

      - name: Upload beta update manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-beta-json-${{ steps.meta.outputs.version_name }}
          path: artifacts/${{ steps.meta.outputs.beta_update_manifest_name }}
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/${{ steps.meta.outputs.apk_name }}
            artifacts/${{ steps.meta.outputs.debug_apk_name }}
            artifacts/fluffyGram-${{ steps.meta.outputs.version_name }}.aab
            artifacts/${{ steps.meta.outputs.update_manifest_name }}
            artifacts/${{ steps.meta.outputs.beta_update_manifest_name }}
          generate_release_notes: false
          overwrite_files: true

      - name: Post release to Telegram channel
        if: (startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true') && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHANNEL_ID != ''
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          COMPARE_URL: ${{ steps.telegram_meta.outputs.compare_url }}
          COMMITS_SUMMARY: ${{ steps.telegram_meta.outputs.commits_summary }}
        run: |
          set -euo pipefail

          CAPTION_FILE="artifacts/telegram-caption.txt"
          {
            echo "🚀 fluffyGram ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "Тег: ${RELEASE_TAG}"
            echo "Разница в коммитах: ${COMPARE_URL}"
            echo
            echo "Изменения:"
            printf '%s\n' "$COMMITS_SUMMARY"
          } > "$CAPTION_FILE"

          CAPTION="$(cat "${CAPTION_FILE}")"

          RESPONSE_FILE="artifacts/telegram-send-response.json"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "document=@artifacts/${{ steps.meta.outputs.apk_name }}" \
            -F "caption=${CAPTION}" \
            -o "$RESPONSE_FILE"

          MESSAGE_ID="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/telegram-send-response.json").read_text(encoding="utf-8"))
          if not data.get("ok"):
            raise SystemExit(f"Telegram sendDocument failed: {data}")
          print(data["result"]["message_id"])
          PY
          )"

          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/pinChatMessage" \
            -d "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -d "message_id=${MESSAGE_ID}" \
            -d "disable_notification=true" >/dev/null
