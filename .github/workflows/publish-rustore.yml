name: Publish To RuStore

on:
  workflow_dispatch:
    inputs:
      package_format:
        description: Package to upload to RuStore
        required: true
        default: aab
        type: choice
        options:
          - aab
          - apk
      submit_for_moderation:
        description: Submit uploaded draft for moderation
        required: true
        default: false
        type: boolean
      publish_type:
        description: RuStore publish type
        required: true
        default: MANUAL
        type: choice
        options:
          - MANUAL
          - INSTANTLY
          - DELAYED
      publish_date_time:
        description: Delay publish time for DELAYED, format yyyy-MM-ddTHH:mm:ss+03:00
        required: false
        type: string
      priority_update:
        description: Mark moderation request as priority update
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-rustore:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
      ANDROID_PLATFORM: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '21.4.7075529'
      PACKAGE_NAME: org.ushastoe.fluffy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout private submodule
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "GH_PAT is not set, skipping private submodule checkout"
            exit 0
          fi
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 fluffyGram_dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          restore-keys: |
            ${{ runner.os }}-ccache-
          create-symlink: true

      - name: Cache CMake intermediates
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: ${{ runner.os }}-cmake-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/jni/**/CMakeLists.txt', 'TMessagesProj_App/build.gradle', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ env.ANDROID_NDK_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Prepare signing and local config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fluffyGram_dev

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fluffyGram_dev/ushastoe-release.keystore

          cat > fluffyGram_dev/devlocal.properties <<EOF
          storeFile=../fluffyGram_dev/ushastoe-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          MAPS_V2_API=${{ secrets.MAPS_V2_API }}
          TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
          EOF

          if [ -f "fluffyGram_dev/google-services.json" ]; then
            echo "Using google-services.json from fluffyGram_dev submodule"
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > fluffyGram_dev/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > fluffyGram_dev/google-services.json
          else
            echo "Missing GOOGLE_SERVICES_JSON or GOOGLE_SERVICES_JSON_BASE64 secret" >&2
            exit 1
          fi

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          props = {}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or "=" not in stripped:
                  continue
              key, value = stripped.split("=", 1)
              props[key.strip()] = value.strip().replace("\\:", ":")

          base_name = props["APP_VERSION_NAME"]
          patch = int(props.get("FLUFFY_PATCH_VERSION", "0"))
          version_name = f"{base_name}.{patch}" if patch > 0 else base_name
          print(f"version_name={version_name}")
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build RuStore package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.package_format }}" = "aab" ]; then
            ./gradlew :TMessagesProj_App:bundleBundleAfatRelease
          else
            ./gradlew :TMessagesProj_App:assembleAfatRelease
          fi
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_CCACHE: ccache
          ORG_GRADLE_PROJECT_FLUFFY_ALL_ABIS: "true"

      - name: Collect package artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${{ github.event.inputs.package_format }}" = "aab" ]; then
            ARTIFACT_PATH="$(find TMessagesProj_App/build/outputs/bundle -path '*bundleAfatRelease/*.aab' | head -n 1)"
            ARTIFACT_NAME="fluffyGram-${{ steps.meta.outputs.version_name }}.aab"
          else
            ARTIFACT_PATH="$(find TMessagesProj_App/build/outputs/apk -path '*afat/release/app.apk' | head -n 1)"
            ARTIFACT_NAME="fluffyGram-${{ steps.meta.outputs.version_name }}.apk"
          fi
          if [ -z "$ARTIFACT_PATH" ]; then
            echo "Package artifact not found" >&2
            exit 1
          fi
          cp "$ARTIFACT_PATH" "artifacts/$ARTIFACT_NAME"
          echo "artifact_path=artifacts/$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_kind=${{ github.event.inputs.package_format }}" >> "$GITHUB_OUTPUT"

      - name: Prepare RuStore private key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rustore
          printf '%s' "${{ secrets.RUSTORE_PRIVATE_KEY_PEM }}" > .rustore/private_key.pem
          chmod 600 .rustore/private_key.pem

      - name: Publish to RuStore
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --package-name "${{ env.PACKAGE_NAME }}"
            --artifact-path "${{ steps.artifact.outputs.artifact_path }}"
            --artifact-kind "${{ steps.artifact.outputs.artifact_kind }}"
            --rustore-key-id "${{ secrets.RUSTORE_KEY_ID }}"
            --rustore-private-key-path ".rustore/private_key.pem"
            --app-name "${{ vars.RUSTORE_APP_NAME }}"
            --app-type "${{ vars.RUSTORE_APP_TYPE || 'MAIN' }}"
            --age-legal "${{ vars.RUSTORE_AGE_LEGAL }}"
            --short-description "${{ vars.RUSTORE_SHORT_DESCRIPTION }}"
            --full-description "${{ vars.RUSTORE_FULL_DESCRIPTION }}"
            --whats-new "${{ vars.RUSTORE_WHATS_NEW || format('Release {0}', steps.meta.outputs.version_name) }}"
            --min-android-version "${{ vars.RUSTORE_MIN_ANDROID_VERSION }}"
            --developer-email "${{ vars.RUSTORE_DEVELOPER_EMAIL }}"
            --publish-type "${{ github.event.inputs.publish_type }}"
          )

          if [ -n "${{ vars.RUSTORE_MODER_INFO }}" ]; then
            args+=(--moder-info "${{ vars.RUSTORE_MODER_INFO }}")
          fi
          if [ -n "${{ vars.RUSTORE_DEVELOPER_WEBSITE }}" ]; then
            args+=(--developer-website "${{ vars.RUSTORE_DEVELOPER_WEBSITE }}")
          fi
          if [ -n "${{ vars.RUSTORE_DEVELOPER_VK_COMMUNITY }}" ]; then
            args+=(--developer-vk-community "${{ vars.RUSTORE_DEVELOPER_VK_COMMUNITY }}")
          fi
          if [ "${{ github.event.inputs.publish_type }}" = "DELAYED" ] && [ -n "${{ github.event.inputs.publish_date_time }}" ]; then
            args+=(--publish-date-time "${{ github.event.inputs.publish_date_time }}")
          fi
          if [ "${{ github.event.inputs.submit_for_moderation }}" = "true" ]; then
            args+=(--submit-for-moderation)
          fi
          if [ "${{ github.event.inputs.priority_update }}" = "true" ]; then
            args+=(--priority-update)
          fi

          python fluffyGram_dev/rustore_publish.py "${args[@]}"

      - name: Upload RuStore artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustore-${{ steps.meta.outputs.version_name }}-${{ steps.artifact.outputs.artifact_kind }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          retention-days: 30
