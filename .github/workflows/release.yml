name: Build and Release FluffyGram

on:
  push:
    tags:
      - 'v*'  # Запускается при пуше нового тега (например, v1.0.0)
  workflow_dispatch:  # Ручной запуск workflow из GitHub UI
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      NDK_VERSION: '21.4.7075529'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false  # Не подтягиваем рекурсивно приватные зависимости

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive

    - name: Copy google-services.json
      run: |
        cp fluffyGram_dev/google-services.json TMessagesProj/google-services.json
        cp fluffyGram_dev/google-services.json TMessagesProj_App/google-services.json

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Cache NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
        key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Cache CMake build
      id: cache-cmake
      uses: actions/cache@v4
      with:
        path: |
          TMessagesProj/.cxx
          TMessagesProj_App/.cxx
        key: ${{ runner.os }}-cmake-${{ hashFiles('TMessagesProj/jni/**/*.cpp', 'TMessagesProj/jni/**/*.c', 'TMessagesProj/jni/**/*.h', 'TMessagesProj/jni/**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Verify Cache Status
      run: |
        echo "=== Cache Verification Report ==="
        echo "NDK Cache Hit: ${{ steps.cache-ndk.outputs.cache-hit }}"
        echo "CMake Cache Hit: ${{ steps.cache-cmake.outputs.cache-hit }}"
        echo ""
        echo "Cache Status Legend:"
        echo "  true  = Cache was restored successfully"
        echo "  false = Cache was not found (will be created after build)"
        echo "================================="

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}'
        cmdline-tools-version: 11076708

    - name: Create keystore file
      run: |
        mkdir -p fluffyGram_dev
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fluffyGram_dev/ushastoe-release.keystore

    - name: Create local properties
      run: |
        cat > fluffyGram_dev/devlocal.properties << EOF
        storeFile=../fluffyGram_dev/ushastoe-release.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        MAPS_V2_API=${{ secrets.MAPS_V2_API }}
        TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}
        TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check Gradle Cache
      run: |
        echo "=== Gradle Cache Information ==="
        echo "Gradle cache is managed by actions/setup-java@v4"
        echo "Cache directory: ~/.gradle/caches"
        if [ -d ~/.gradle/caches ]; then
          echo "Gradle cache exists - restored from previous build"
          echo "Cache size: $(du -sh ~/.gradle/caches 2>/dev/null | cut -f1)"
        else
          echo "Gradle cache not found - will be created during build"
        fi
        echo "================================="

    - name: Build Release APKs
      run: ./gradlew :TMessagesProj_App:assembleRelease --stacktrace
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
        NDK_CCACHE: ccache

    - name: Show ccache statistics
      run: |
        echo "=== ccache Statistics ==="
        ccache -s
        echo ""
        echo "Key Metrics:"
        echo "  - Cache hit rate indicates how effective caching is"
        echo "  - Higher hit rate = better build performance"
        echo "  - First run will show low hit rate (cache is being populated)"
        echo "========================="

    - name: Find APK files
      id: find_apks
      run: |
        echo "Finding built APK files..."
        find TMessagesProj_App/build/outputs/apk -name "*.apk" -type f
        
        # Сохраняем пути к APK в outputs
        echo "apk_arm64=$(find TMessagesProj_App/build/outputs/apk/bundleAfat/release -name "*.apk" -type f | head -1)" >> $GITHUB_OUTPUT

    - name: Rename APK files
      run: |
        # Читаем версии из gradle.properties
        VERSION=$(grep "APP_VERSION_NAME" gradle.properties | cut -d'=' -f2)
        VERSION_CODE=$(grep "APP_VERSION_CODE" gradle.properties | cut -d'=' -f2)
        
        # Переименовываем APK файлы
        if [ -f "${{ steps.find_apks.outputs.apk_arm64 }}" ]; then
          cp "${{ steps.find_apks.outputs.apk_arm64 }}" "FluffyGram-v${VERSION}-arm64-v8a.apk"
          echo "Created: FluffyGram-v${VERSION}-arm64-v8a.apk"
        else
          echo "Warning: arm64 APK not found"
        fi
        
        # Показываем найденные APK для проверки
        echo "Available APK files:"
        find . -name "FluffyGram-*.apk" -type f || echo "No APK files found with FluffyGram-* pattern"

    - name: Get version info
      id: version
      run: |
        VERSION=$(grep "APP_VERSION_NAME" gradle.properties | cut -d'=' -f2)
        VERSION_CODE=$(grep "APP_VERSION_CODE" gradle.properties | cut -d'=' -f2)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

    - name: Generate release notes from commits
      id: release_notes
      run: |
        set -euo pipefail
        git fetch --tags --force

        CURRENT_TAG=""
        if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
          CURRENT_TAG="${GITHUB_REF_NAME}"
        fi

        PREV_TAG=""
        TAG_LIST=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags || true)
        if [ -n "$TAG_LIST" ]; then
          while IFS= read -r tag; do
            if [ -z "$CURRENT_TAG" ] || [ "$tag" != "$CURRENT_TAG" ]; then
              PREV_TAG="$tag"
              break
            fi
          done <<< "$TAG_LIST"
        fi

        echo "Current tag: ${CURRENT_TAG:-<none>}"
        echo "Previous tag: ${PREV_TAG:-<none>}"

        if [ -n "$PREV_TAG" ]; then
          COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)")
          HEADER="## Changes since $PREV_TAG"
        else
          COMMITS=$(git log -n 50 --pretty=format:"- %s (%h)")
          HEADER="## Changes included in this release"
        fi

        if [ -z "$COMMITS" ]; then
          if [ -n "$PREV_TAG" ]; then
            COMMITS="No new commits after $PREV_TAG."
          else
            COMMITS="No commits found."
          fi
        fi

        RELEASE_BODY=$(printf "%s\n\n%s\n" "$HEADER" "$COMMITS")
        {
          echo 'body<<EOF'
          printf '%s\n' "$RELEASE_BODY"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Delete existing release
      if: (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
      run: |
        TAG_NAME="${{ github.event_name == 'workflow_dispatch' && format('v{0}-{1}', steps.version.outputs.version, steps.version.outputs.version_code) || github.ref_name }}"
        echo "Checking for existing release with tag: $TAG_NAME"
        if gh release view "$TAG_NAME" > /dev/null 2>&1; then
          echo "Deleting existing release: $TAG_NAME"
          gh release delete "$TAG_NAME" --yes
        else
          echo "No existing release found for tag: $TAG_NAME"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      if: (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}-{1}', steps.version.outputs.version, steps.version.outputs.version_code) || github.ref_name }}
        name: FluffyGram ${{ steps.version.outputs.version }} (${{ steps.version.outputs.version_code }})
        draft: false
        prerelease: false
        generate_release_notes: false
        append_body: false
        body: ${{ steps.release_notes.outputs.body }}
        files: |
          FluffyGram-*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FluffyGram-APKs
        path: FluffyGram-*.apk
        retention-days: 30
