def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)
def devLocalPropsFile = rootProject.file('fluffyGram_dev/devlocal.properties')
def devLocalProps = new Properties()
if (devLocalPropsFile.exists()) {
    devLocalProps.load(new FileInputStream(devLocalPropsFile))
}
def getDevLocalProp = { String key, String fallback ->
    def value = devLocalProps.getProperty(key)
    return value != null && value.trim().length() > 0 ? value.trim() : fallback
}
def localGoogleServices = rootProject.file('fluffyGram_dev/google-services.json')
def fluffyPatchVersion = Math.max(0, Integer.parseInt((project.findProperty("FLUFFY_PATCH_VERSION") ?: "0").toString()))
def fluffyVersionName = fluffyPatchVersion > 0 ? APP_VERSION_NAME + "." + fluffyPatchVersion : APP_VERSION_NAME
def fluffyPremiumPublicKey = (project.findProperty("FLUFFY_PREMIUM_PUBLIC_KEY")
        ?: getDevLocalProp("FLUFFY_PREMIUM_PUBLIC_KEY", (System.getenv("FLUFFY_PREMIUM_PUBLIC_KEY") ?: "").trim()))
        .toString()
def fluffySyncBackendUrl = getDevLocalProp("FLUFFY_SYNC_BACKEND_URL", "")
def fluffySyncHelperBot = getDevLocalProp("FLUFFY_SYNC_HELPER_BOT", "")
def fluffyAllAbisEnabled = (project.findProperty("FLUFFY_ALL_ABIS") ?: "false").toString().toBoolean()
def fluffyNativeAbis = fluffyAllAbisEnabled
        ? ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
        : ["arm64-v8a"]
def nativeCcache = (System.getenv("NDK_CCACHE") ?: "").trim()
def nativeCmakeArguments = ['-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21']
if (!nativeCcache.isEmpty()) {
    nativeCmakeArguments += [
        "-DANDROID_CCACHE=${nativeCcache}",
        "-DCMAKE_C_COMPILER_LAUNCHER=${nativeCcache}",
        "-DCMAKE_CXX_COMPILER_LAUNCHER=${nativeCcache}"
    ]
}
android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig = true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        ndk {
            abiFilters(*fluffyNativeAbis)
        }

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        buildConfigField "int", "TELEGRAM_APP_ID", getDevLocalProp("TELEGRAM_APP_ID", "4")
        buildConfigField "String", "TELEGRAM_APP_HASH", "\"" + getDevLocalProp("TELEGRAM_APP_HASH", "014b35b6184100b085b0d0572f9b5103") + "\""
        buildConfigField "String", "FLUFFY_PREMIUM_PUBLIC_KEY", "\"" + fluffyPremiumPublicKey.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
        buildConfigField "String", "FLUFFY_SYNC_BACKEND_URL", "\"" + fluffySyncBackendUrl.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
        buildConfigField "String", "FLUFFY_SYNC_HELPER_BOT", "\"" + fluffySyncHelperBot.replace("\\", "\\\\").replace("\"", "\\\"") + "\""

        externalNativeBuild {
