def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}

def requestedTaskNames = gradle.startParameter.taskNames
def isPublicAllowed = !hasProperty("IS_PRIVATE") || !property("IS_PRIVATE").toString().toBoolean()

def syncLocalGoogleServices = tasks.register("syncLocalGoogleServices", Copy) {
    onlyIf { localGoogleServices.exists() }
    from(localGoogleServices)
    into(layout.projectDirectory)
    rename { "google-services.json" }
}

apply plugin: 'com.google.gms.google-services'

def checkVisibility = tasks.register("checkVisibility") {
    doFirst {
        def isPrivateBuild = requestedTaskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
}

preBuild.dependsOn checkVisibility
preBuild.dependsOn syncLocalGoogleServices
tasks.matching { it.name.startsWith("process") && it.name.endsWith("GoogleServices") }.configureEach {
    dependsOn syncLocalGoogleServices
}
["processReleaseGoogleServices", "processStandaloneGoogleServices", "processDebugGoogleServices"].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn syncLocalGoogleServices
    }
}
tasks.matching { it.name.startsWith("sync") && it.name.endsWith("LibJars") }.configureEach { task ->
    if (task.name.contains("Release")) {
        task.dependsOn("compileReleaseJavaWithJavac", "bundleLibRuntimeToJarRelease")
    } else if (task.name.contains("Debug")) {
        task.dependsOn("compileDebugJavaWithJavac", "bundleLibRuntimeToJarDebug")
    }
}
